name: Deploy Media Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare same-origin FFmpeg worker
        run: |
          mkdir -p vendor/ffmpeg /tmp/ffmpeg-package
          npm pack @ffmpeg/ffmpeg@0.12.10 --pack-destination /tmp
          tar -xzf /tmp/ffmpeg-ffmpeg-0.12.10.tgz -C /tmp/ffmpeg-package
          cp /tmp/ffmpeg-package/package/dist/esm/*.js vendor/ffmpeg/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
